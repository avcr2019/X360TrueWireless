name: Build Windows Exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows Test Tool
        run: |
          cargo build --release --package x360truewireless-proto --example win_test

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x360-windows-tools
          path: target/release/examples/win_test.exe
